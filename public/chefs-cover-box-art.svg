<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024">
  <!-- Stand-in cover for Lmongolyan Chefs; replace with chefs-cover-box-art.png -->
  <defs>
    <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#e6d8b7"/><rect width="60" height="60" fill="#d8c59e"/><rect x="60" y="60" width="60" height="60" fill="#d8c59e"/>
    </pattern>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.4" fill="#201b16" opacity=".16"/></pattern>
  </defs>
  <rect width="1536" height="1024" fill="url(#tiles)"/>
  <!-- sunburst behind the pass -->
  <g transform="translate(900 520)" opacity=".9">
    <circle r="430" fill="#c3973a" opacity=".35"/>
    <g fill="#a44f39" opacity=".25">
      <path d="M0 0 L-60 -520 L60 -520 Z"/><path d="M0 0 L360 -380 L420 -300 Z"/><path d="M0 0 L520 -40 L520 60 Z"/>
      <path d="M0 0 L380 360 L300 420 Z"/><path d="M0 0 L-360 -380 L-420 -300 Z"/><path d="M0 0 L-520 -40 L-520 60 Z"/>
    </g>
  </g>
  <!-- counter -->
  <rect x="0" y="720" width="1536" height="304" fill="#6b4d31"/>
  <rect x="0" y="720" width="1536" height="40" fill="#9c7449"/>
  <!-- flying burger -->
  <g transform="translate(900 470) rotate(-10)">
    <ellipse cx="0" cy="170" rx="250" ry="40" fill="#201b16" opacity=".25"/>
    <path d="M-230 90 Q0 150 230 90 L220 120 Q0 180 -220 120 Z" fill="#b8793a"/>
    <path d="M-240 40 Q-120 90 0 50 Q120 90 240 40 L230 80 Q0 120 -230 80 Z" fill="#6aa84c"/>
    <rect x="-225" y="-10" width="450" height="64" rx="30" fill="#6e3f26"/>
    <path d="M-220 -30 Q-110 20 0 -20 Q110 20 220 -30 L210 0 Q0 30 -210 0 Z" fill="#c9452f"/>
    <path d="M-230 -40 Q-230 -230 0 -240 Q230 -230 230 -40 Z" fill="#dca25a"/>
    <g fill="#f6e3b8"><ellipse cx="-90" cy="-150" rx="16" ry="9"/><ellipse cx="20" cy="-190" rx="16" ry="9"/><ellipse cx="110" cy="-130" rx="16" ry="9"/><ellipse cx="-20" cy="-110" rx="16" ry="9"/></g>
  </g>
  <!-- tomato and lettuce tumbling -->
  <g transform="translate(360 330)"><circle r="92" fill="#c9452f"/><ellipse cx="-30" cy="-26" rx="30" ry="20" fill="#e0684f"/><ellipse cx="0" cy="-86" rx="36" ry="16" fill="#4f7f38"/></g>
  <g transform="translate(1330 250) rotate(20)"><ellipse rx="110" ry="92" fill="#4d8a3a"/><ellipse rx="74" ry="60" fill="#78b35a"/><path d="M0 60 L0 -56" stroke="#cfe6a8" stroke-width="8"/></g>
  <!-- two chef hats -->
  <g transform="translate(250 740)"><circle cx="0" cy="-60" r="90" fill="#fbf6ea"/><circle cx="-70" cy="-20" r="60" fill="#fbf6ea"/><circle cx="70" cy="-20" r="60" fill="#fbf6ea"/><rect x="-90" y="-10" width="180" height="70" fill="#567b78"/></g>
  <g transform="translate(1250 760)"><circle cx="0" cy="-60" r="90" fill="#fbf6ea"/><circle cx="-70" cy="-20" r="60" fill="#fbf6ea"/><circle cx="70" cy="-20" r="60" fill="#fbf6ea"/><rect x="-90" y="-10" width="180" height="70" fill="#a44f39"/></g>
  <rect width="1536" height="1024" fill="url(#dots)"/>
</svg>
